name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          # تم التعديل هنا: تغيير إصدار الجافا إلى 11 وهو الأكثر استقراراً مع مشاريع فلاتر
          java-version: '11' 

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # إضافة خطوة تنظيف للتأكد من عدم وجود ملفات قديمة تسبب تعارض
      - name: Clean build
        run: flutter clean

      # تم التعديل هنا: إضافة "-v" لطباعة تفاصيل الخطأ في حال فشل البناء مرة أخرى
      - name: Build APK
        run: flutter build apk --debug -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
