name: Build and Release Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # التعديل الأول: إضافة --split-per-abi لتقسيم التطبيق وتقليل حجمه
      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      # التعديل الثاني: رفع جميع النسخ المصغرة
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' 
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: الإصدار v1.0.${{ github.run_number }}
          # استخدمنا علامة النجمة (*) لرفع جميع ملفات الـ APK المصغرة
          files: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Build APK
        run: flutter build apk --release

      # خطوة إنشاء الإصدار ورفع ملف الـ APK
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        # يمنع النشر عند عمل Pull Request
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' 
        with:
          # تحديد اسم الـ Tag ورقم الإصدار بناءً على رقم التشغيل
          tag_name: v1.0.${{ github.run_number }}
          # توجيه GitHub لإنشاء الـ Tag على آخر تعديل لتجنب رسالة الخطأ
          target_commitish: ${{ github.sha }}
          name: الإصدار v1.0.${{ github.run_number }}
          # مسار ملف الـ APK المراد رفعه
          files: build/app/outputs/flutter-apk/app-release.apk
